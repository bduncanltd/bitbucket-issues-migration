# Bitbucket to Jira migration configuration template.
# Copy this file to migration_config.yaml and fill in your values.
# migration_config.yaml is gitignored to prevent accidental secret commits.

bitbucket:
  # Archive created by: python -m bitbucket_export workspace/repo
  archive-dir: ".archive/workspace/repo"

jira:
  url: "https://your-site.atlassian.net/"
  email: "your-email@hello-world.com"
  api-token: "your-api-token-here"
  board-id: "FOO"
